name: release

# Build release binaries for macOS (Intel) and Linux (Intel) and attach
# them to a GitHub Release whenever a version tag is pushed.
#
#   git tag v0.1.1
#   git push origin v0.1.1
#
# The `sjbis upgrade` command consumes the assets produced here. Asset
# names are stable and encode the Rust target triple so the client can
# pick the right one:
#
#   sjbis-x86_64-apple-darwin.tar.gz
#   sjbis-x86_64-unknown-linux-musl.tar.gz

on:
  push:
    tags:
      - "v*"
  # Allow building artifacts on demand without publishing a release.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-13          # Intel macOS runner
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so build.rs can read the real git hash.
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools (linux)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package tarball
        id: package
        shell: bash
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/sjbis"
          stage="$(mktemp -d)"
          cp "$bin" "$stage/sjbis"
          # Ship the dashboard assets next to the binary so the daemon can
          # be run from the extracted directory if desired.
          cp -R static "$stage/static"
          tarball="sjbis-${{ matrix.target }}.tar.gz"
          tar -czf "$tarball" -C "$stage" sjbis static
          shasum -a 256 "$tarball" > "$tarball.sha256"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: sjbis-${{ matrix.target }}
          path: |
            ${{ steps.package.outputs.tarball }}
            ${{ steps.package.outputs.tarball }}.sha256

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.package.outputs.tarball }}
            ${{ steps.package.outputs.tarball }}.sha256
          generate_release_notes: true
