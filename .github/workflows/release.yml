name: release

# Build release binaries and attach them to a GitHub Release whenever a
# version tag is pushed:
#
#   git tag v0.1.2
#   git push origin v0.1.2
#
# The `sjbis upgrade` command consumes the assets produced here. Asset
# names are stable and encode the Rust target triple so the client can
# pick the right one:
#
#   sjbis-aarch64-apple-darwin.tar.gz       (macOS Apple Silicon)
#   sjbis-x86_64-unknown-linux-musl.tar.gz  (Linux Intel)
#
# Compute is offloaded to self-hosted runners when available:
#   - aarch64-apple-darwin  → self-hosted `sjbmbp` (spare M1), else macos-14
#   - x86_64-unknown-linux-musl → self-hosted `homestar-runner-sjbis`, else ubuntu-latest
#
# (An x86_64 macOS / Intel build is intentionally not produced; add one only
# if there's actual demand for Intel Macs.)
#
# Self-hosted routing requires a RUNNER_STATUS_TOKEN secret (a PAT with
# Administration: read on this repo) so the pick job can query runner status;
# without it everything transparently falls back to GitHub-hosted runners.

on:
  push:
    tags:
      - "v*"
  # Allow building artifacts on demand without publishing a release.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Probe the self-hosted runners and decide where each native build should
  # run. Any failure (missing token, API error, offline runner) falls back to
  # the matching GitHub-hosted runner so releases never block.
  pick-runners:
    runs-on: ubuntu-latest
    outputs:
      macos_arm64: ${{ steps.pick.outputs.macos_arm64 }}
      linux_musl: ${{ steps.pick.outputs.linux_musl }}
    steps:
      - name: Detect self-hosted runner availability
        id: pick
        env:
          GH_TOKEN: ${{ secrets.RUNNER_STATUS_TOKEN }}
        run: |
          set -uo pipefail

          # Echoes the self-hosted runs-on JSON if the named runner is online
          # and idle, otherwise the provided GitHub-hosted fallback (as a JSON
          # string). Falls back on any error so the release can't be blocked.
          choose() {
            local name="$1" self_json="$2" fallback="$3"
            if [ -z "${GH_TOKEN:-}" ]; then
              echo "$fallback"; return
            fi
            local n
            n=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runners" \
              --jq "[.runners[] | select(.name==\"$name\" and .status==\"online\" and .busy==false)] | length" \
              2>/tmp/err)
            if [ -z "${n:-}" ]; then
              echo "::warning::runner probe for $name failed: $(cat /tmp/err 2>/dev/null)" 1>&2
              echo "$fallback"
            elif [ "$n" -ge 1 ]; then
              echo "$self_json"
            else
              echo "$fallback"
            fi
          }

          macos=$(choose "sjbmbp" '["self-hosted","sjbmbp"]' '"macos-14"')
          linux=$(choose "homestar-runner-sjbis" '["self-hosted","homestar-runner"]' '"ubuntu-latest"')

          echo "macos_arm64=$macos" >> "$GITHUB_OUTPUT"
          echo "linux_musl=$linux" >> "$GITHUB_OUTPUT"
          echo "::notice::aarch64-apple-darwin → $macos ; x86_64-unknown-linux-musl → $linux"

  build-macos-arm64:
    name: build aarch64-apple-darwin
    needs: pick-runners
    runs-on: ${{ fromJSON(needs.pick-runners.outputs.macos_arm64) }}
    env:
      TARGET: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ensure Rust toolchain + target
        run: |
          set -euo pipefail
          if [ -f "$HOME/.cargo/env" ]; then . "$HOME/.cargo/env"; fi
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            . "$HOME/.cargo/env"
          fi
          rustup target add "$TARGET"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Build release binary
        run: cargo build --release --locked --target "$TARGET"
      - name: Package tarball
        id: package
        run: |
          set -euo pipefail
          stage="$(mktemp -d)"
          cp "target/$TARGET/release/sjbis" "$stage/sjbis"
          cp -R static "$stage/static"
          tarball="sjbis-$TARGET.tar.gz"
          tar -czf "$tarball" -C "$stage" sjbis static
          shasum -a 256 "$tarball" > "$tarball.sha256"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: sjbis-aarch64-apple-darwin
          path: |
            ${{ steps.package.outputs.tarball }}
            ${{ steps.package.outputs.tarball }}.sha256
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.package.outputs.tarball }}
            ${{ steps.package.outputs.tarball }}.sha256
          generate_release_notes: true

  build-linux-musl:
    name: build x86_64-unknown-linux-musl
    needs: pick-runners
    runs-on: ${{ fromJSON(needs.pick-runners.outputs.linux_musl) }}
    env:
      TARGET: x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ensure Rust toolchain + musl
        run: |
          set -euo pipefail
          if [ -f "$HOME/.cargo/env" ]; then . "$HOME/.cargo/env"; fi
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            . "$HOME/.cargo/env"
          fi
          rustup target add "$TARGET"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          # musl-gcc: present on the self-hosted box; install on hosted ubuntu.
          if ! command -v musl-gcc >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y musl-tools
          fi
      - name: Build release binary
        run: cargo build --release --locked --target "$TARGET"
      - name: Package tarball
        id: package
        run: |
          set -euo pipefail
          stage="$(mktemp -d)"
          cp "target/$TARGET/release/sjbis" "$stage/sjbis"
          cp -R static "$stage/static"
          tarball="sjbis-$TARGET.tar.gz"
          tar -czf "$tarball" -C "$stage" sjbis static
          shasum -a 256 "$tarball" > "$tarball.sha256"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: sjbis-x86_64-unknown-linux-musl
          path: |
            ${{ steps.package.outputs.tarball }}
            ${{ steps.package.outputs.tarball }}.sha256
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.package.outputs.tarball }}
            ${{ steps.package.outputs.tarball }}.sha256
          generate_release_notes: true
