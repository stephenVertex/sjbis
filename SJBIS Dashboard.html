<link rel="stylesheet" href="styles.css?v=3" />
<script>
// Aggressive cache-busting: append current timestamp to all local resources
(function() {
  var t = Date.now();
  document.querySelectorAll('link[rel="stylesheet"], script[src]').forEach(function(el) {
    var src = el.getAttribute('href') || el.getAttribute('src');
    if (src && !src.startsWith('http')) {
      var sep = src.includes('?') ? '&' : '?';
      var newSrc = src + sep + '_t=' + t;
      if (el.hasAttribute('href')) el.setAttribute('href', newSrc);
      if (el.hasAttribute('src')) el.setAttribute('src', newSrc);
    }
  });
})();
</script>
